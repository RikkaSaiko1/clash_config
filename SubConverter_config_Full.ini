;=========================================================
; Region Groups
;=========================================================

; Hong Kong
custom_proxy_group=🇭🇰 HK AUTO`url-test`.*(港|(?<![A-Za-z])HK(?![A-Za-z])|hk|Hong Kong|HongKong|hongkong)`https://www.apple.com/library/test/success.html`300,5,50

; Japan
custom_proxy_group=🇯🇵 JP AUTO`url-test`.*(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|(?<![A-Za-z])JP(?![A-Za-z])|Japan)`https://www.apple.com/library/test/success.html`300,5,50

; United States
custom_proxy_group=🇺🇸 US AUTO`url-test`.*(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(?<![A-Za-z])US(?![A-Za-z])|United States)`https://www.apple.com/library/test/success.html`300,5,50

; Taiwan
custom_proxy_group=🇹🇼 TW AUTO`url-test`.*(台|新北|彰化|(?<![A-Za-z])TW(?![A-Za-z])|Taiwan)`https://www.apple.com/library/test/success.html`300,5,50

; Singapore
custom_proxy_group=🇸🇬 SG AUTO`url-test`.*(新加坡|狮城|(?<![A-Za-z])SG(?![A-Za-z])|Singapore)`https://www.apple.com/library/test/success.html`300,5,50

; South Korea
custom_proxy_group=🇰🇷 KR AUTO`url-test`.*((?<![A-Za-z])KR(?![A-Za-z])|Korea|KOR|首尔|韩|韓)`https://www.apple.com/library/test/success.html`300,5,50

; Other
; 除 HK / JP / US / TW / SG / KR 外的其他节点
custom_proxy_group=🌐 Other AUTO`url-test`^(?!.*(港|(?<![A-Za-z])HK(?![A-Za-z])|hk|Hong Kong|HongKong|hongkong|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|(?<![A-Za-z])JP(?![A-Za-z])|Japan|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(?<![A-Za-z])US(?![A-Za-z])|United States|台|新北|彰化|(?<![A-Za-z])TW(?![A-Za-z])|Taiwan|新加坡|坡|狮城|(?<![A-Za-z])SG(?![A-Za-z])|Singapore|(?<![A-Za-z])KR(?![A-Za-z])|Korea|KOR|首尔|韩|韓)).*$`https://www.apple.com/library/test/success.html`300,5,50


enable_rule_generator=true
overwrite_original_rules=true