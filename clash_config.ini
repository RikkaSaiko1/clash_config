; PROXY    -> https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Static.png
; AUTO     -> https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Urltest.png
; AIGC     -> https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/OpenAI.png
; Telegram -> https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Telegram.png
; Google   -> https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Google.png
; HK AUTO  -> https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/HK.png
; SG AUTO  -> https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/SG.png
; JP AUTO  -> https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/JP.png
; US AUTO  -> https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/US.png
; GLOBAL   -> https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Global.png

[custom]
; 远程规则集映射（顺序即优先级）
ruleset=PROXY,https://raw.githubusercontent.com/xishang0128/rules/main/clash%20or%20stash/prevent_dns_leak/prevent_dns_leak_domain.list
ruleset=DIRECT,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.yaml
ruleset=AIGC,https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Bing/Bing.yaml
ruleset=AIGC,https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Copilot/Copilot.yaml
ruleset=AIGC,https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/BardAI/BardAI.yaml
ruleset=AIGC,https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/OpenAI/OpenAI.yaml
ruleset=AIGC,https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Claude/Claude.yaml
ruleset=PROXY,https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Steam/Steam.yaml
ruleset=Telegram,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/telegram.yaml
ruleset=Telegram,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/telegram.yaml
ruleset=Google,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/google.yaml
ruleset=Google,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/google.yaml
ruleset=PROXY,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/geolocation-!cn.yaml
ruleset=DIRECT,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.yaml
ruleset=DIRECT,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.yaml
ruleset=PROXY,[]FINAL

; 自定义策略组
custom_proxy_group=PROXY`select`[]AUTO`[]HK AUTO`[]SG AUTO`[]JP AUTO`[]US AUTO
custom_proxy_group=AUTO`url-test`^(?!.*(?:GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置)).*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=AIGC`select`[]SG AUTO`[]JP AUTO`[]US AUTO
custom_proxy_group=Telegram`select`[]HK AUTO`[]SG AUTO`[]JP AUTO`[]US AUTO
custom_proxy_group=Google`select`[]HK AUTO`[]SG AUTO`[]JP AUTO`[]US AUTO
custom_proxy_group=HK AUTO`url-test`^(?=.*(?:香港|Hong Kong|HK|🇭🇰)).*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=SG AUTO`url-test`^(?=.*(?:新加坡|Singapore|🇸🇬)).*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=JP AUTO`url-test`^(?=.*(?:日本|Japan|🇯🇵)).*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=US AUTO`url-test`^(?=.*(?:美国|USA|🇺🇸)).*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=GLOBAL`select`[]PROXY`[]AUTO`[]AIGC`[]Telegram`[]Google`[]HK AUTO`[]SG AUTO`[]JP AUTO`[]US AUTO

enable_rule_generator=true
overwrite_original_rules=true
