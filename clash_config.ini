ruleset=DIRECT,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.yaml
ruleset=DIRECT,https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.yaml
ruleset=PROXY,[]FINAL

; 自定义策略组
custom_proxy_group=PROXY`select``[]AUTO`[]HK AUTO`[]SG AUTO`[]JP AUTO`[]US AUTO
custom_proxy_group=AUTO`url-test`.*`http://www.gstatic.com/generate_204`60``50`true`(?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置
custom_proxy_group=AIGC`select``[]SG AUTO`[]JP AUTO`[]US AUTO
custom_proxy_group=Telegram`select``[]HK AUTO`[]SG AUTO`[]JP AUTO`[]US AUTO
custom_proxy_group=Google`select``[]HK AUTO`[]SG AUTO`[]JP AUTO`[]US AUTO
custom_proxy_group=HK AUTO`url-test`(?i)香港|Hong Kong|HK|🇭🇰`http://www.gstatic.com/generate_204`60``50`true`(?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置
custom_proxy_group=SG AUTO`url-test`(?i)新加坡|Singapore|🇸🇬`http://www.gstatic.com/generate_204`60``50`true`(?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置
custom_proxy_group=JP AUTO`url-test`(?i)日本|Japan|🇯🇵`http://www.gstatic.com/generate_204`60``50`true`(?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置
custom_proxy_group=US AUTO`url-test`(?i)美国|USA|🇺🇸`http://www.gstatic.com/generate_204`60``50`true`(?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置
custom_proxy_group=GLOBAL`select``[]PROXY`[]AUTO`[]AIGC`[]Telegram`[]Google`[]HK AUTO`[]SG AUTO`[]JP AUTO`[]US AUTO

enable_rule_generator=true
overwrite_original_rules=true
