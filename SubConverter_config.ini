;---------------------------------------------------------
; Singapore
;---------------------------------------------------------

custom_proxy_group=🇸🇬 SG`select`(新加坡|坡|狮城|SG|Singapore)

;---------------------------------------------------------
; South Korea
;---------------------------------------------------------

custom_proxy_group=🇰🇷 KR`select`(KR|Korea|KOR|首尔|韩|韓)

;---------------------------------------------------------
; Other
; 除 HK / JP / US / TW / SG / KR 外的其他节点
;---------------------------------------------------------

custom_proxy_group=🌐 Other`select`^(?!.*(港|HK|hk|Hong Kong|HongKong|hongkong|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|台|新北|彰化|TW|Taiwan|新加坡|坡|狮城|SG|Singapore|KR|Korea|KOR|首尔|韩|韓)).*$`

