;=========================================================

;=========================================================
; Main
;=========================================================

custom_proxy_group=🚀 PROXY`select`.*`[]♻️ AUTO`[]🇭🇰 HK`[]🇯🇵 JP`[]🇺🇸 US`[]🇸🇬 SG`[]🇹🇼 TW`[]🇰🇷 KR`[]🌐 Other

custom_proxy_group=♻️ AUTO`url-test`.*`https://www.apple.com/library/test/success.html`600,,50


