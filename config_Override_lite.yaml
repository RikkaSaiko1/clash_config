    url: 'https://static-file-global.353355.xyz/rules/cn-additional-list.mrs'
    path: './ruleset/cn-additional-list.mrs'
    path-in-bundle: 'geo/geosite/cn.mrs'

  cn:
    <<: *rule_providers_domain
    url: 'https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/cn.mrs'
    path: './ruleset/cn.mrs'
    path-in-bundle: 'geo/geosite/cn.mrs'

  dns:
    url: 'https://raw.githubusercontent.com/xishang0128/rules/main/clash%20or%20stash/prevent_dns_leak/prevent_dns_leak_domain.list'
    path: './ruleset/dns.list'
    path-in-bundle: 'geo/geosite/dns.list'
    behavior: domain
    interval: 86400
    format: yaml
    type: http


# 策略组通用配置
group_common:
  group_common_select:
    &group_common_select {type: select,interval: 300,timeout: 1500,max-failed-times: 5,empty-fallback: REJECT,url: 'https://www.apple.com/library/test/success.html',lazy: true}

  group_common_auto:
    &group_common_auto {type: url-test,interval: 60,timeout: 1500,max-failed-times: 5,empty-fallback: REJECT,url: 'https://www.apple.com/library/test/success.html',lazy: true,tolerance: 50,include-all: true,exclude-type: 'DIRECT'}


# 通用代理节点组
proxies_common:  # 通用代理节点组
  proxies_default:
    &proxies_default {proxies: ['PROXY','AUTO','HK Group','SG Group','JP Group','US Group','TW Group','KR Group','Other Group']}

  proxies_direct:
    &proxies_direct {proxies: ['PROXY','AUTO','HK Group','SG Group','JP Group','US Group','TW Group','KR Group','Other Group','DIRECT']}

  proxies_AI:
    &proxies_AI {proxies: ['PROXY','SG Group','JP Group','US Group','KR Group',]}
  
  proxies_proxy:
    &proxies_proxy {proxies: ['AUTO','HK Group','JP Group','US Group','SG Group','TW Group','KR Group','Other Group']}


# 地区过滤器正则表达式定义
group_filter:

  HK_filter:
    &HK_filter {filter: '(?i)(🇭🇰|香港|(?<![A-Za-z])HKG?(?![A-Za-z])|hong\s*kong)'}

  JP_filter:
    &JP_filter {filter: '(?i)(🇯🇵|日本|东京|大阪|京都|(?<![A-Za-z])JPN?(?![A-Za-z])|japan)'}

  US_filter:
    &US_filter {filter: '(?i)(🇺🇸|美国|纽约|洛杉矶|旧金山|芝加哥|休斯顿|迈阿密|西雅图|波士顿|华盛顿|拉斯维加斯|圣何塞|圣地亚哥|(?<![A-Za-z])USA?(?![A-Za-z])|america|united\s*states)'}

  SG_filter:
    &SG_filter {filter: '(?i)(🇸🇬|新加坡|狮城|(?<![A-Za-z])SGP?(?![A-Za-z])|singapore)'}

  TW_filter:
    &TW_filter {filter: '(?i)(🇹🇼|台湾|台北|高雄|(?<![A-Za-z])TWN?(?![A-Za-z])|taiwan)'}

  KR_filter:
    &KR_filter {filter: '(?i)(🇰🇷|韩国|首尔|釜山|仁川|大邱|(?<![A-Za-z])KOR?(?![A-Za-z])|korea|south\s*korea)'}

  exclude_filter:
    &exclude_filter {exclude-filter: '(?i)(🇭🇰|香港|(?<![A-Za-z])HKG?(?![A-Za-z])|hong\s*kong|🇯🇵|日本|东京|大阪|京都|(?<![A-Za-z])JPN?(?![A-Za-z])|japan|🇺🇸|美国|纽约|洛杉矶|旧金山|芝加哥|休斯顿|迈阿密|西雅图|波士顿|华盛顿|拉斯维加斯|圣何塞|圣地亚哥|(?<![A-Za-z])USA?(?![A-Za-z])|america|united\s*states|🇸🇬|新加坡|狮城|(?<![A-Za-z])SGP?(?![A-Za-z])|singapore|🇹🇼|台湾|台北|高雄|(?<![A-Za-z])TWN?(?![A-Za-z])|taiwan|🇰🇷|韩国|首尔|釜山|仁川|大邱|(?<![A-Za-z])KOR?(?![A-Za-z])|korea|south\s*korea)',exclude-type: 'DIRECT'}


# 定义分流策略组
proxy-groups:  # 定义分流策略组

  - name: 'PROXY'
    <<: [*group_common_select, *proxies_proxy]
    include-all-proxies: true
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png'

  - name: 'AUTO'
    <<: *group_common_auto
    hidden: false
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png'

  - name: 'YouTube'
    <<: [*group_common_select, *proxies_default]
    icon: 'https://fastly.jsdelivr.net/gh/MiToverG422/Qure@master/IconSet/Color/YouTube.png'

  - name: 'Google'
    <<: [*group_common_select, *proxies_default]
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png'

  - name: 'AI'
    <<: [*group_common_select, *proxies_AI]
    default-selected: 'US Group'
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ChatGPT.png'

  - name: 'Telegram'
    <<: [*group_common_select, *proxies_default]
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png'

  - name: 'Twitter'
    <<: [*group_common_select, *proxies_default]
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Twitter.png'

  ### 地区策略组

  - name: 'HK Group'
    <<: [*group_common_select, *HK_filter]
    include-all: true
    proxies: ['HK Auto Group']
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png'

  - name: 'HK Auto Group'
    <<: [*group_common_auto, *HK_filter]
    hidden: true

  - name: 'JP Group'
    <<: [*group_common_select, *JP_filter]
    include-all: true
    proxies: ['JP Auto Group']
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png'

  - name: 'JP Auto Group'
    <<: [*group_common_auto, *JP_filter]
    hidden: true

  - name: 'US Group'
    <<: [*group_common_select, *US_filter]
    include-all: true
    proxies: ['US Auto Group']
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png'

  - name: 'US Auto Group'
    <<: [*group_common_auto, *US_filter]
    hidden: true

  - name: 'SG Group'
    <<: [*group_common_select, *SG_filter]
    include-all: true
    proxies: ['SG Auto Group']
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png'

  - name: 'SG Auto Group'
    <<: [*group_common_auto, *SG_filter]
    hidden: true

  - name: 'TW Group'
    <<: [*group_common_select, *TW_filter]
    include-all: true
    proxies: ['TW Auto Group']
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Taiwan.png'

  - name: 'TW Auto Group'
    <<: [*group_common_auto, *TW_filter]
    hidden: true

  - name: 'KR Group'
    <<: [*group_common_select, *KR_filter]
    include-all: true
    proxies: ['KR Auto Group']
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Korea.png'

  - name: 'KR Auto Group'
    <<: [*group_common_auto, *KR_filter]
    hidden: true

  ## 其他地区
  - name: 'Other Group'
    <<: [*group_common_select, *exclude_filter]
    include-all: true
    proxies: ['Other Auto Group']
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/World_Map.png'

  - name: 'Other Auto Group'
    <<: [*group_common_auto, *exclude_filter]
    hidden: true

rules:
  # 私有网络直连
  - RULE-SET,private,DIRECT

  # 国内直连
  - RULE-SET,geolocation-cn,DIRECT
  - RULE-SET,games_cn,DIRECT # 已包含 steam 下载域名
  - RULE-SET,epicgames,DIRECT
  - RULE-SET,nvidia_cn,DIRECT
  - RULE-SET,apple_cn,DIRECT
  - RULE-SET,microsoft_cn,DIRECT
  - DOMAIN,fsend.cn,DIRECT
  - DOMAIN,international-gfe.download.nvidia.com,DIRECT

  # 禁用国外 QUIC 流量
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((OR,((RULE-SET,cn_additional),(RULE-SET,cn_ip,no-resolve)))))),REJECT

  # 广告拦截
  - RULE-SET,adblockmihomolite,REJECT

  # 拦截 STUN/TURN 探测（3478-3481 STUN/TURN、5349 STUN-over-TLS、19302-19309 Google STUN）
  - AND,((NETWORK,UDP),(OR,((DST-PORT,3478-3481),(DST-PORT,5349),(DST-PORT,19302-19309)))),REJECT
  - DOMAIN-KEYWORD,stun,REJECT

  # 代理规则
  - RULE-SET,youtube,YouTube
  - RULE-SET,google,Google
  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,ai,AI
  - RULE-SET,telegram,Telegram
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,twitter,Twitter
  - RULE-SET,twitter_ip,Twitter,no-resolve

  # dns防泄漏
  - RULE-SET,dns,PROXY

  # 兜底规则
  - RULE-SET,geolocation-!cn,PROXY
  - RULE-SET,cn_ip,DIRECT
  - RULE-SET,private_ip,DIRECT

  - MATCH,PROXY
