    path: './ruleset/ai.mrs'
    path-in-bundle: 'geo/geosite/category-ai-!cn.mrs'

  telegram:
    <<: *rule_providers_domain
    url: 'https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/telegram.mrs'
    path: './ruleset/telegram.mrs'
