; DIRECT rulesets
ruleset=DIRECT,https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geosite/private.list
ruleset=DIRECT,https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geosite/cn.list
ruleset=DIRECT,https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geosite/fakeip-filter.list
ruleset=DIRECT,https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geosite/geolocation-cn.list
; Download DIRECT
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list
; Custom Direct
ruleset=DIRECT,[]DOMAIN,fsend.cn
ruleset=DIRECT,[]DOMAIN,international-gfe.download.nvidia.com

; AdBlock
ruleset=🛑 AdBlock,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 AdBlock,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list

; Google / FCM
ruleset=DIRECT,https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geosite/google@cn.list
ruleset=🌐 Google,https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geosite/googlefcm.list
ruleset=🌐 Google,https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geosite/google.list

; Telegram
ruleset=📲 Telegram,https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geosite/telegram.list
ruleset=📲 Telegram,https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geoip/telegram.list

; AI
ruleset=🤖 AI,https://raw.githubusercontent.com/appshubcc/bett-rules/refs/heads/meta/geo/geosite/category-ai-!cn.list

; YouTube
ruleset=▶️ YouTube,https://raw.githubusercontent.com/appshubcc/bett-rules/refs/heads/meta/geo/geosite/youtube.list

; Steam
ruleset=🚀 PROXY,https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geosite/steam.list
ruleset=🚀 PROXY,https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geoip/steam.list
ruleset=DIRECT,https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geosite/steam@cn.list
; TikTok
ruleset=🎵 TikTok,https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geosite/tiktok.list
ruleset=🎵 TikTok,https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geoip/tiktok.list

; Twitter
ruleset=🐦 Twitter,https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geosite/twitter.list
ruleset=🐦 Twitter,https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geoip/twitter.list

; Netflix
ruleset=🎬 Netflix,https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geosite/netflix.list
ruleset=🎬 Netflix,https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geoip/netflix.list


; PikPak
ruleset=☁️ PikPak,https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geosite/pikpak.list

; dns
ruleset=🚀 PROXY,https://raw.githubusercontent.com/xishang0128/rules/main/clash%20or%20stash/prevent_dns_leak/prevent_dns_leak_domain.list

; China Direct
ruleset=DIRECT,https://raw.githubusercontent.com/appshubcc/bett-rules/meta/geo/geoip/cn.list
ruleset=DIRECT,[]GEOIP,CN

; Final
ruleset=🚀 PROXY,[]FINAL

;=========================================================
; Service Groups
;=========================================================

; PROXY GROUPS
custom_proxy_group=🚀 PROXY`select`.*`[]♻️ AUTO`[]🇭🇰 HK`[]🇯🇵 JP`[]🇺🇸 US`[]🇸🇬 SG`[]🇹🇼 TW`[]🇰🇷 KR`[]🌐 Other

custom_proxy_group=♻️ AUTO`url-test`.*`https://www.apple.com/library/test/success.html`600,5,50

; AI
custom_proxy_group=🤖 AI`select`[]🇺🇸 US`[]🚀 PROXY`[]🇸🇬 SG`[]🇯🇵 JP`[]🇰🇷 KR

; YouTube
custom_proxy_group=▶️ YouTube`select`[]🚀 PROXY`[]♻️ AUTO`[]🇸🇬 SG`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇺🇸 US`[]🇰🇷 KR`[]🌐 Other`[]DIRECT

; Google
custom_proxy_group=🌐 Google`select`[]🚀 PROXY`[]♻️ AUTO`[]🇺🇸 US`[]🇭🇰 HK`[]🇸🇬 SG`[]🇯🇵 JP`[]🇹🇼 TW`[]🇰🇷 KR`[]🌐 Other`[]DIRECT

; Telegram
custom_proxy_group=📲 Telegram`select`[]🚀 PROXY`[]♻️ AUTO`[]🇺🇸 US`[]🇭🇰 HK`[]🇸🇬 SG`[]🇯🇵 JP`[]🇹🇼 TW`[]🇰🇷 KR`[]🌐 Other`[]DIRECT

; TikTok
custom_proxy_group=🎵 TikTok`select`[]🇯🇵 JP`[]🚀 PROXY`[]♻️ AUTO`[]🇭🇰 HK`[]🇺🇸 US`[]🇸🇬 SG`[]🇹🇼 TW`[]🇰🇷 KR`[]🌐 Other

; Twitter
custom_proxy_group=🐦 Twitter`select`[]🚀 PROXY`[]♻️ AUTO`[]🇺🇸 US`[]🇭🇰 HK`[]🇸🇬 SG`[]🇯🇵 JP`[]🇹🇼 TW`[]🇰🇷 KR`[]🌐 Other

; Netflix
custom_proxy_group=🎬 Netflix`select`[]🇺🇸 US`[]🚀 PROXY`[]♻️ AUTO`[]🇭🇰 HK`[]🇯🇵 JP`[]🇸🇬 SG`[]🇹🇼 TW`[]🇰🇷 KR`[]🌐 Other`[]DIRECT

; PikPak
custom_proxy_group=☁️ PikPak`select`[]🚀 PROXY`[]♻️ AUTO`[]🇺🇸 US`[]🇭🇰 HK`[]🇸🇬 SG`[]🇯🇵 JP`[]🇹🇼 TW`[]🇰🇷 KR`[]🌐 Other`[]DIRECT

; AdBlock
custom_proxy_group=🛑 AdBlock`select`[]REJECT`[]REJECT-DROP`[]PASS`[]DIRECT

;=========================================================
; Region Groups
;=========================================================

; Hong Kong
custom_proxy_group=🇭🇰 HK`url-test`(港|HK|hk|Hong Kong|HongKong|hongkong)`https://www.apple.com/library/test/success.html`600,5,50

; Japan
custom_proxy_group=🇯🇵 JP`url-test`(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)

; United States
custom_proxy_group=🇺🇸 US`url-test`(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)`https://www.apple.com/library/test/success.html`600,5,50

; Taiwan
custom_proxy_group=🇹🇼 TW`url-test`(台|新北|彰化|TW|Taiwan)`https://www.apple.com/library/test/success.html`600,5,50

; Singapore
custom_proxy_group=🇸🇬 SG`url-test`(新加坡|坡|狮城|SG|Singapore)`https://www.apple.com/library/test/success.html`600,5,50

; South Korea
custom_proxy_group=🇰🇷 KR`url-test`(KR|Korea|KOR|首尔|韩|韓)`https://www.apple.com/library/test/success.html`600,5,50

; Other
; 除 HK / JP / US / TW / SG / KR 外的其他节点
custom_proxy_group=🌐 Other`url-test`^(?!.*(港|HK|hk|Hong Kong|HongKong|hongkong|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|台|新北|彰化|TW|Taiwan|新加坡|坡|狮城|SG|Singapore|KR|Korea|KOR|首尔|韩|韓)).*$``https://www.apple.com/library/test/success.html`600,5,50


enable_rule_generator=true
overwrite_original_rules=true